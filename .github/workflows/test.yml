name: Test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Tests read a frozen feed (test/feed-snapshot; not in the public repo, where those tests skip). The live feed
      # (private repo, read-only FEED_READ_TOKEN, contents: read) is only for the drift report below, which can't
      # fail the build. Without the secret both steps are skipped. Only these steps see the token
      - name: Is there a feed token?
        id: feedtoken
        env:
          T: ${{ secrets.FEED_READ_TOKEN }}
        run: echo "present=$([ -n "$T" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Check out the feed
        if: steps.feedtoken.outputs.present == 'yes'
        uses: actions/checkout@v4
        with:
          repository: vitasta-dev/feed
          token: ${{ secrets.FEED_READ_TOKEN }}
          path: feed-checkout
          sparse-checkout: data
          persist-credentials: false
      - run: npx vitest run
      # wall-clock tests on their own, serially, so parallel load can't trip them
      - run: npx vitest run -c vitest.timing.config.ts
      # New model IDs in the live feed that the scanner doesn't know yet (test/feed-drift.test.ts). A report, not a
      # gate: the daily feed refresh must never turn CI red. Teach the scanner the IDs, then refresh the snapshot
      - name: Feed drift report (does not fail the build)
        if: steps.feedtoken.outputs.present == 'yes'
        continue-on-error: true
        run: npx vitest run test/feed-drift.test.ts
        env:
          VITASTA_FEED_DRIFT: "1"
          VITASTA_FEED_DATA: ${{ github.workspace }}/feed-checkout/data
      - run: npm run build
