name: Vitasta API check
description: Fail pull requests that add calls to retired or soon-retiring AI models and APIs. Runs entirely in your CI.
branding:
  icon: alert-triangle
  color: orange

inputs:
  feed:
    description: Optional path to a local Vitasta change feed (JSON files) inside the workspace. Without it, dates are looked up on app.vitasta.dev (model names, API operations and versions only; never code).
    required: false
    default: ""
  base:
    description: Git ref to compare against. Defaults to the pull request's base branch.
    required: false
    default: ""
  path:
    description: Directory to scan, relative to the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # Pinned by full commit, not a movable tag (v4.4.0)
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "22"

    # The built scanner (dist/) with production dependencies only: no build tools or test runners in your CI
    - name: Install Vitasta scanner
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        [ -f dist/cli.js ] || { echo "::error::This ref of the Vitasta action has no built scanner (dist/). Use a release tag such as vitasta-dev/vitasta@v0.2.0."; exit 1; }
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # Inputs go through env vars, never straight into the script, so they can't inject shell commands.
    - name: Check this change
      shell: bash
      env:
        VITASTA_FEED: ${{ inputs.feed }}
        VITASTA_BASE: ${{ inputs.base }}
        VITASTA_PATH: ${{ inputs.path }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        base="${VITASTA_BASE:-origin/${PR_BASE_REF:-main}}"
        cd "$GITHUB_WORKSPACE"
        node "$GITHUB_ACTION_PATH/dist/cli.js" check "$VITASTA_PATH" \
          --base "$base" ${VITASTA_FEED:+--feed "$GITHUB_WORKSPACE/$VITASTA_FEED"} --github
